<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMI Map · Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="building" aria-label="SMI Map login">
    <!-- Striped roof -->
    <div class="roof" aria-hidden="true"></div>

    <section class="wall">
      <header class="title-row">
        <h1 class="title" id="title">Login</h1>
        <!-- Little campus hut -->
        <svg class="hut" viewBox="0 0 48 52" width="48" height="52" aria-hidden="true">
          <path d="M4 20 L24 5 L44 20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M10 18 L24 8 L38 18 Z" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M14 16 L20 11 M19 17 L27 10 M25 17 L32 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <rect x="11" y="20" width="26" height="28" rx="1.5" fill="none" stroke="currentColor" stroke-width="3"/>
          <path d="M20 48 V33 a4 4 0 0 1 8 0 V48" fill="currentColor"/>
          <path d="M7 48 H41" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        </svg>
      </header>

      <form class="login-form" id="loginForm" novalidate>
        <label class="field" for="email">
          <svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <rect x="3" y="5.5" width="18" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M3.5 6.5 L12 13 L20.5 6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          <input id="email" name="email" type="email" placeholder="Student Email" autocomplete="email" required>
        </label>

        <label class="field" for="password">
          <svg class="icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <rect x="5" y="10.5" width="14" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M8.5 10.5 V8 a3.5 3.5 0 0 1 7 0 V10.5" fill="none" stroke="currentColor" stroke-width="2"/>
            <circle cx="12" cy="15.5" r="1.4" fill="currentColor"/>
          </svg>
          <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
          <button type="button" class="eye" id="togglePw" aria-label="Show password" aria-pressed="false">
            <!-- closed eye with lashes, as in the sketch -->
            <svg class="eye-closed" viewBox="0 0 28 20" width="28" height="20" aria-hidden="true">
              <path d="M3 7 Q14 17 25 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
              <path d="M7 11 L5 14 M11 13 L10 16.5 M17 13 L18 16.5 M21 11 L23 14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg class="eye-open" viewBox="0 0 28 20" width="28" height="20" aria-hidden="true">
              <path d="M3 10 Q14 0 25 10 Q14 20 3 10 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
              <circle cx="14" cy="10" r="3.4" fill="currentColor"/>
            </svg>
          </button>
        </label>

        <div class="links">
          <a class="forgot" href="#" id="forgot">Forgot password?</a>
          <a class="forgot" href="#" id="switchMode">New here? Join</a>
        </div>
        <p class="message" id="message" role="status" aria-live="polite"></p>

        <!-- Ledge above the doors -->
        <div class="ledge" aria-hidden="true"><span></span><span></span><span></span></div>

        <!-- The doors are the submit button -->
        <button type="submit" class="doors" id="doors" aria-label="Enter the map">
          <span class="doorway" aria-hidden="true"><span class="glow">welcome in ✦</span></span>
          <span class="door door-left" aria-hidden="true"><span class="pane"></span></span>
          <span class="door door-right" aria-hidden="true"><span class="pane"></span><span class="knob"></span></span>
        </button>
        <p class="hint" aria-hidden="true">tap the doors to enter</p>
      </form>
    </section>

    <!-- Floor -->
    <div class="floor" aria-hidden="true"></div>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
