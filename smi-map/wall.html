<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SMI Poster Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="wall.css">
</head>
<body class="wall-page">
  <main class="board">
    <header class="board-head">
      <h1 class="title">Poster Wall</h1>
      <p class="sub">Make a folder, pin your poster. Everyone sees it.</p>
      <form class="new-folder" id="newFolder">
        <input id="folderName" maxlength="40" placeholder="Your folder name" required>
        <button type="submit">+ New folder</button>
      </form>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </header>

    <section class="folders" id="folders" aria-label="Folders"></section>
  </main>

  <!-- Folder viewer -->
  <dialog class="viewer" id="viewer">
    <header class="viewer-head">
      <h2 id="viewerTitle"></h2>
      <button class="close" id="closeViewer" aria-label="Close">✕</button>
    </header>
    <div class="viewer-actions" id="ownerActions" hidden>
      <label class="upload">
        + Add poster
        <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
      </label>
      <button class="danger" id="deleteFolder">Delete folder</button>
    </div>
    <p class="message" id="viewerMessage" role="status" aria-live="polite"></p>
    <div class="posters" id="posters"></div>
  </dialog>

  <template id="folderTpl">
    <button class="folder">
      <span class="folder-icon" aria-hidden="true"><span class="tab"></span><span class="body"><img alt=""></span></span>
      <span class="folder-name"></span>
      <span class="folder-meta"></span>
    </button>
  </template>

  <script type="module" src="wall.js"></script>
</body>
</html>
